<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Андрей & Полина — Свадьба 27.07.2027</title>
    <meta name="description" content="Приглашение на свадьбу Андрея и Полины. 27 июля 2027 года, Рязань" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Montserrat:wght@100;200;300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        background-color: #FAFAF8;
        color: #1A1A1A;
        font-family: 'Montserrat', sans-serif;
      }
      #root {
        width: 100%;
        min-height: 100vh;
      }
      /* Pre-loader fallback */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FAFAF8;
        z-index: 99999;
        transition: opacity 0.8s ease;
      }
      .initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .initial-loader-text {
        font-family: 'Great Vibes', cursive;
        font-size: 3rem;
        color: #C9A96E;
        animation: pulse-gold 2s ease-in-out infinite;
      }
      @keyframes pulse-gold {
        0%, 100% { opacity: 0.5; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" id="initialLoader">
        <div class="initial-loader-text">А & П</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
